name: Agent Sandbox Images

on:
  push:
    branches:
      - mayflower-production
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'api/**'
      - 'controllers/**'
      - 'extensions/**'
      - 'internal/**'
      - 'clients/python/agentic-sandbox-client/sandbox-router/**'
      - '.github/workflows/agent-sandbox-images.yml'
  pull_request:
    branches:
      - mayflower-production
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'api/**'
      - 'controllers/**'
      - 'extensions/**'
      - 'internal/**'
      - 'clients/python/agentic-sandbox-client/sandbox-router/**'
      - '.github/workflows/agent-sandbox-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-sandbox-controller
            context: .
            dockerfile: ./Dockerfile
            inject_version: true
          - name: sandbox-router
            context: ./clients/python/agentic-sandbox-client/sandbox-router
            dockerfile: ./clients/python/agentic-sandbox-client/sandbox-router/Dockerfile
            inject_version: false
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe --tags` needs full history + tags, not the
          # shallow default, or GIT_VERSION falls back to "unknown".
          fetch-depth: 0

      - name: Compute version build-args
        # Only the controller bakes version metadata into its Go binary;
        # the router is a plain Python app and has nothing to stamp.
        if: matrix.inject_version
        id: version
        run: |
          set -euo pipefail
          git_version=$(git describe --tags --always --dirty 2>/dev/null || echo unknown)
          git_sha=$(git rev-parse HEAD)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "git_version=$git_version"
            echo "git_sha=$git_sha"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/mayflower-production' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped cache keys so controller and router don't trash each
          # other's layers when both run in parallel.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            ${{ matrix.inject_version && format('GIT_VERSION={0}', steps.version.outputs.git_version) || '' }}
            ${{ matrix.inject_version && format('GIT_SHA={0}', steps.version.outputs.git_sha) || '' }}
            ${{ matrix.inject_version && format('BUILD_DATE={0}', steps.version.outputs.build_date) || '' }}

      - name: Verify multi-arch manifest
        # Same guard as the dashboard workflow: fail hard if either arch
        # drops out of the manifest list (e.g. a future Dockerfile
        # change accidentally pins --platform, or a native dep loses
        # arm64 wheels). Skip on PR since nothing is pushed.
        if: github.event_name != 'pull_request'
        env:
          # Pull the tag list via env: so the shell never sees the raw
          # ${{ ... }} expansion — avoids the command-injection vector
          # flagged in GitHub's workflow-injection guide even though
          # metadata-action output is server-controlled.
          IMAGE_NAME: ${{ matrix.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag=$(printf '%s\n' "$TAGS" | head -n1)
          echo "Inspecting $tag"
          docker buildx imagetools inspect "$tag" | tee /tmp/manifest.txt
          grep -q "linux/amd64" /tmp/manifest.txt \
            || { echo "::error::${IMAGE_NAME}: linux/amd64 missing from manifest"; exit 1; }
          grep -q "linux/arm64" /tmp/manifest.txt \
            || { echo "::error::${IMAGE_NAME}: linux/arm64 missing from manifest"; exit 1; }
