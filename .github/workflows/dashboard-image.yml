name: Dashboard Image

on:
  push:
    branches:
      - mayflower-production
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-image.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agent-sandbox-dashboard

jobs:
  build:
    name: Build and Push Dashboard Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/mayflower-production' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifest
        # Only after a real push — on PRs the build stays local and
        # there's no registry manifest to inspect.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Pick any produced tag; the manifest list is identical across
          # tags from the same build so one lookup is enough.
          tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting $tag"
          docker buildx imagetools inspect "$tag" | tee /tmp/manifest.txt
          # Fail hard if either arch is missing — silent single-arch
          # regressions (e.g. an accidental --platform override, or a
          # native dep without arm64 wheels) would otherwise ship
          # amd64-only and only surface when an arm64 node pulls.
          grep -q "linux/amd64" /tmp/manifest.txt \
            || { echo "::error::multi-arch regression: linux/amd64 missing from manifest"; exit 1; }
          grep -q "linux/arm64" /tmp/manifest.txt \
            || { echo "::error::multi-arch regression: linux/arm64 missing from manifest"; exit 1; }
