name: Test langchain-agent-sandbox (TypeScript) 📦

on:
  pull_request:
    paths:
      - 'clients/typescript/langchain-agent-sandbox/**'
      - '.github/workflows/test-langchainjs.yml'
  push:
    branches:
      - main
    paths:
      - 'clients/typescript/langchain-agent-sandbox/**'
      - '.github/workflows/test-langchainjs.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run TypeScript Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: clients/typescript/langchain-agent-sandbox

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test
