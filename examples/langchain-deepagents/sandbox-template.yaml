# SandboxTemplate for LangChain DeepAgents
# This template defines the container image and resources for sandbox pods.
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: python-deepagent
spec:
  podTemplateSpec:
    metadata:
      labels:
        app: deepagent-sandbox
    spec:
      containers:
        - name: sandbox-runtime
          # Dedicated runtime image for deepagents — sibling directory
          # `examples/langchain-deepagents-runtime/`. Mirrors the
          # python-runtime-sandbox protocol but resolves its base
          # directory from WORKDIR/SANDBOX_RUNTIME_DIR instead of
          # hardcoding /app, and ships ripgrep + git in the base image.
          #
          # Build with:
          #   docker build -t langchain-deepagents-runtime:latest \
          #     examples/langchain-deepagents-runtime/
          image: langchain-deepagents-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: runtime
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
          # Deepagents convention: agents write outputs under /workspace.
          # The runtime reads its base directory from WORKDIR, so this
          # value also defines where the file API serves from.
          workingDir: /workspace
---
# Optional: WarmPool for faster sandbox startup
# Uncomment to pre-warm sandbox pods
